    .segment { cursor: pointer; transition: all 0.15s ease-in-out; stroke: #ffffff; stroke-width: 1px; }

    /* Pop-up Card Styling */

    .popup-bg { fill: #0f172a; stroke: #dc2626; stroke-width: 2px; rx: 6px; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5)); }

    .popup-body { fill: #f8fafc; font-size: 11px; font-weight: 400; }
    .popup-bold { fill: #38bdf8; font-size: 11px; font-weight: 700; }

    /* UI Controls */
    .zoom-btn { cursor: pointer; fill: #1e293b; transition: fill 0.2s; }
    .zoom-btn:hover { fill: #dc2626; }
    .btn-text { fill: #ffffff; font-size: 16px; font-weight: bold; pointer-events: none; text-anchor: middle; dominant-baseline: central; }

  <!-- JAVASCRIPT FOR HOVER, ZOOM & PAN CONTROLS -->
  <script type="text/javascript">
    <![CDATA[
    function showPopup(id) {
      var el = document.getElementById(id);
      if (el) el.classList.add('active');
    }

    function hidePopup(id) {
      var el = document.getElementById(id);
      if (el) el.classList.remove('active');
    }

    // ViewBox Zoom & Pan System
    var svg = document.getElementById('main-svg');
    var origW = 1100, origH = 960;
    var curW = origW, curH = origH;
    var curX = 0, curY = 0;
    var isPanning = false;
    var startX = 0, startY = 0;

    function updateViewBox() {
      svg.setAttribute('viewBox', curX + ' ' + curY + ' ' + curW + ' ' + curH);
    }

    function zoom(factor) {
      var newW = curW * factor;
      var newH = curH * factor;
      
      // Keep center point stable during zoom
      curX += (curW - newW) / 2;
      curY += (curH - newH) / 2;
      curW = newW;
      curH = newH;

      updateViewBox();
    }

    function resetZoom() {
      curW = origW;
      curH = origH;
      curX = 0;
      curY = 0;
      updateViewBox();
    }

    // Drag / Pan Event Handlers
    svg.addEventListener('mousedown', function(e) {
      if (e.target.classList.contains('zoom-btn')) return;
      
      isPanning = true;
      startX = e.clientX;
      startY = e.clientY;
      svg.style.cursor = 'grabbing';
    });

    window.addEventListener('mousemove', function(e) {
      if (!isPanning) return;
      
      var dx = e.clientX - startX;
      var dy = e.clientY - startY;

      var scaleX = curW / svg.clientWidth;
      var scaleY = curH / svg.clientHeight;

      curX -= dx * scaleX;
      curY -= dy * scaleY;

      startX = e.clientX;
      startY = e.clientY;

      updateViewBox();
    });

    window.addEventListener('mouseup', function() {
      isPanning = false;
      svg.style.cursor = 'grab';
    });

 /*   
    // Mousewheel Zoom
    svg.addEventListener('wheel', function(e) {
      e.preventDefault();
      var factor = e.deltaY > 0 ? 1.1 : 0.9;
      zoom(factor);
    }, { passive: false });

  */
    
    ]]>
  </script>
